<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Vibrant High-Contrast Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A9FF68"/>
      <stop offset="50%" stop-color="#46EDF3"/>
      <stop offset="100%" stop-color="#FF8989"/>
    </linearGradient>

    <linearGradient id="dbTopGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A9FF68"/>
      <stop offset="100%" stop-color="#30C67C"/>
    </linearGradient>

    <linearGradient id="dbSideGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#46EDF3"/>
      <stop offset="100%" stop-color="#1b231d"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Shield Frame (Transparent Fill) -->
  <path 
    d="M 64 10 L 110 28 V 68 C 110 92 64 116 64 116 C 64 116 18 92 18 68 V 28 Z" 
    fill="none" 
    stroke="url(#shieldGrad)" 
    stroke-width="4.5" 
    stroke-linejoin="round"
    filter="url(#neonGlow)"
  />

  <!-- ERD Relation Lines (Background Layer) -->
  <path d="M 36 44 L 64 30 L 92 44" fill="none" stroke="#46EDF3" stroke-width="2" stroke-dasharray="3 3" opacity="0.8"/>
  <path d="M 36 76 L 64 90 L 92 76" fill="none" stroke="#A9FF68" stroke-width="2" stroke-dasharray="3 3" opacity="0.8"/>

  <!-- Database Cylinder 1: Center Main -->
  <g transform="translate(42, 34)">
    <!-- Top Cap -->
    <ellipse cx="22" cy="10" rx="22" ry="8" fill="url(#dbTopGrad)" stroke="#A9FF68" stroke-width="1.5"/>
    <!-- Body -->
    <path d="M 0 10 V 32 C 0 36.4 9.8 40 22 40 C 34.2 40 44 36.4 44 32 V 10" fill="url(#dbSideGrad)" stroke="#46EDF3" stroke-width="1.5" opacity="0.9"/>
    <!-- Middle Ring -->
    <path d="M 0 21 C 0 25.4 9.8 29 22 29 C 34.2 29 44 25.4 44 21" fill="none" stroke="#A9FF68" stroke-width="1.5"/>
    <!-- Data Indicator Nodes -->
    <circle cx="10" cy="18" r="2" fill="#A9FF68" filter="url(#neonGlow)"/>
    <circle cx="18" cy="27" r="2" fill="#46EDF3" filter="url(#neonGlow)"/>
  </g>

  <!-- Left ERD Table Node -->
  <rect x="24" y="52" width="16" height="24" rx="4" fill="#131915" stroke="#A9FF68" stroke-width="2"/>
  <line x1="24" y1="60" x2="40" y2="60" stroke="#A9FF68" stroke-width="1.5"/>
  <circle cx="32" cy="67" r="2" fill="#FF8989"/>

  <!-- Right ERD Table Node -->
  <rect x="88" y="52" width="16" height="24" rx="4" fill="#131915" stroke="#46EDF3" stroke-width="2"/>
  <line x1="88" y1="60" x2="104" y2="60" stroke="#46EDF3" stroke-width="1.5"/>
  <circle cx="96" cy="67" r="2" fill="#A9FF68"/>

  <!-- Connecting Node Orbs -->
  <circle cx="64" cy="20" r="4" fill="#A9FF68" filter="url(#neonGlow)"/>
  <circle cx="64" cy="104" r="4" fill="#FF8989" filter="url(#neonGlow)"/>
</svg>
